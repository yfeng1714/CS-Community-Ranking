name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://csr:csr_local_dev_password@localhost:5432/csr
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: csr
          POSTGRES_PASSWORD: csr_local_dev_password
          POSTGRES_USER: csr
        options: >-
          --health-cmd "pg_isready -U csr -d csr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
        ports:
          - 5432:5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Prepare local environment contract
        run: cp .env.example .env

      - name: Apply migrations to an empty database
        run: pnpm db:migrate

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration

      - name: Build production application
        run: pnpm build
